logging:
  level:
    root: WARN

server:
  port: ${SERVER_PORT:8080}
  servlet.context-path: /retail

app:
  frontend:
    reset-password-url: https://spa-retail-dev.up.railway.app/reset-password

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/retail
    username: pgusr
    password: pgpwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        show-sql: true
        globally_quoted_identifiers: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  flyway:
    enabled: true
  mail:
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    host: smtp.gmail.io
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

rest:
  client:
    colors:
      base-url: http://localhost:8081/colors

auth:
  users:
    - username: user@mail.com
      password: User_1234
      roles: ROLE_USER
    - username: admin@mail.com
      roles: ROLE_ADMIN
      password: Admin_1234
    - username: manager@mail.com
      roles: ROLE_Manager
      password: Manager_1234
    - username: user-2@mail.com
      roles: ROLE_USER
      password: Test_1234

resilience4j:
  retry:
    instances:
      imagesRetry:
        maxAttempts: 20
        waitDuration: 10
        fail-after-max-attempts: true
