springdoc.swagger-ui.enabled: true
app :
  frontend:
    reset-password-url: https://spa-retail-dev.up.railway.app/reset-password

spring:
  mail :
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/retail}
    username: ${DATASOURCE_USER:pgusr}
    password: ${DATASOURCE_PASSWORD:pgpwd}
  flyway:
    enabled: true

  jpa:
    show-sql: true

auth:
  users:
    - username: user
      password: ${LOCAL_PASSWORD:user}
      roles: USER
    - username: admin
      roles: ADMIN
      password: ${LOCAL_PASSWORD:admin}
