management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

app :
  frontend:
    reset-password-url: https://spa-retail-dev.up.railway.app/reset-password

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO

server:
  port: ${SERVER_PORT:8080}
  servlet.context-path: /retail

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        show-sql: true
        globally_quoted_identifiers: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration

rest:
  client:
    colors:
      base-url: http://${MOCKED_SERVICES_HOST:localhost}:${MOCKED_SERVICES_PORT:8081}/colors

resilience4j:
  ratelimiter:
    instances:
      passwordReset:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0

images:
  product: https://www.demyhealth.com/storage/media/2/default-product-image.png

prometheus:
  stage: ${PROMETHEUS_STAGE}
  url: ${PROMETHEUS_URL}

password-reset:
  base-path: /v1/password-reset/